# Render blueprint: single web service hosting the FastAPI API + the built React UI.
# The build step compiles the frontend into frontend/dist, which FastAPI serves at "/".
services:
  - type: web
    name: parcelpilot-ops-copilot
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # set this in the Render dashboard
      - key: MODEL
        value: claude-sonnet-5
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
