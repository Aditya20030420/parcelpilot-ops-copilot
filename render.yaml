# Render blueprint: single web service hosting the FastAPI API + the built React UI.
# The build step compiles the frontend into frontend/dist, which FastAPI serves at "/".
services:
  - type: web
    name: parcelpilot-ops-copilot
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false            # set this in the Render dashboard (Gemini/OpenAI/Groq key)
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: MODEL
        value: gemini-3.5-flash-lite
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
