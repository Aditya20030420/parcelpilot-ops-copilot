# Render blueprint: one Docker web service hosting the FastAPI API + built React UI.
# The data pack is NOT in the repo — add it in the Render dashboard as a Secret File named
# `datapack.b64` (base64 of a zip of the 6 PDFs + xlsx); the app rehydrates it at startup.
services:
  - type: web
    name: parcelpilot-ops-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set in the dashboard (your Gemini / OpenAI / Groq key)
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: MODEL
        value: gemini-3.5-flash-lite
